name: Product CI

on:
  push:
    branches:
      - 'product/**'
  pull_request:
    branches:
      - 'product/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@4c125117fe7c5aed11272ec4213f602f012f89f2

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      # The Android app is intentionally excluded until the custom source-built
      # bootstrap exists and its reviewed digest replaces UNSET in the lock.
      # App builds fail closed without that locked artifact.
      - name: Test reusable terminal libraries
        run: ./gradlew :terminal-emulator:test :terminal-view:test :termux-shared:test
