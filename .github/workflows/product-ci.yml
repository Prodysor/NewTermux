name: Product CI

on:
  push:
    branches:
      - 'product/**'
  pull_request:
    branches:
      - 'product/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@4c125117fe7c5aed11272ec4213f602f012f89f2

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Test product artifact verifier
        run: python3 scripts/ci/test_verify_product_artifact.py

      - name: Resolve locked immutable bootstrap release
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          lock='gradle/product-bootstrap.properties'
          package_commit="$(sed -n 's/^packageCommit=//p' "$lock")"
          expected_sha="$(sed -n 's/^sha256=//p' "$lock")"
          [[ "$package_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
          tag="product-bootstrap-aarch64-${package_commit}"
          api='https://api.github.com/repos/Prodysor/termux-packages'
          common_headers=(
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2026-03-10'
            -H 'User-Agent: Prodysor-Product-CI'
          )
          curl --fail --silent --show-error --location --retry 5 \
            --proto '=https' --tlsv1.2 "${common_headers[@]}" \
            "$api/releases/tags/$tag" > "$RUNNER_TEMP/bootstrap-release.json"
          curl --fail --silent --show-error --location --retry 5 \
            --proto '=https' --tlsv1.2 "${common_headers[@]}" \
            "$api/git/ref/tags/$tag" > "$RUNNER_TEMP/bootstrap-tag.json"
          verified="$(python3 scripts/ci/verify-product-artifact.py release \
            --lock "$lock" \
            --release-json "$RUNNER_TEMP/bootstrap-release.json" \
            --tag-json "$RUNNER_TEMP/bootstrap-tag.json")"
          echo "asset_id=$(jq -er '.asset_id' <<<"$verified")" >> "$GITHUB_OUTPUT"
          echo "asset_size=$(jq -er '.asset_size' <<<"$verified")" >> "$GITHUB_OUTPUT"

      - name: Download and verify locked bootstrap
        env:
          ASSET_ID: ${{ steps.bootstrap.outputs.asset_id }}
          ASSET_SIZE: ${{ steps.bootstrap.outputs.asset_size }}
        shell: bash
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/bootstrap-aarch64.zip"
          curl --fail --silent --show-error --location --retry 5 \
            --proto '=https' --tlsv1.2 \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H 'User-Agent: Prodysor-Product-CI' \
            "https://api.github.com/repos/Prodysor/termux-packages/releases/assets/$ASSET_ID" \
            --output "$asset.partial"
          test "$(stat --format='%s' "$asset.partial")" = "$ASSET_SIZE"
          mv "$asset.partial" "$asset"
          python3 scripts/ci/verify-product-artifact.py bootstrap \
            --lock gradle/product-bootstrap.properties \
            --archive "$asset" | tee "$RUNNER_TEMP/bootstrap-verification.json"

      - name: Clean build and test ARM64 application
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/product-gradle-home
          PRODYSOR_BOOTSTRAP_PATH: ${{ runner.temp }}/bootstrap-aarch64.zip
          TERMUX_PACKAGE_VARIANT: apt-android-7
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache clean
          test ! -e app/src/main/cpp/bootstrap-aarch64.zip
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks \
            :terminal-emulator:test \
            :terminal-view:test \
            :termux-shared:test \
            :app:testDebugUnitTest \
            :app:assembleDebug

      - name: Verify built APK identity and embedded bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/debug -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one debug APK; found ${#apks[@]}." >&2
            exit 1
          fi
          apk="${apks[0]}"
          mapfile -t apkanalyzers < <(find "$ANDROID_HOME" -type f -name apkanalyzer -print | sort -V)
          mapfile -t apksigners < <(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V)
          test "${#apkanalyzers[@]}" -gt 0
          test "${#apksigners[@]}" -gt 0
          apkanalyzer="${apkanalyzers[${#apkanalyzers[@]}-1]}"
          apksigner="${apksigners[${#apksigners[@]}-1]}"
          test "$("$apkanalyzer" manifest application-id "$apk")" = 'com.prodysor.term'
          "$apkanalyzer" manifest print "$apk" > "$RUNNER_TEMP/AndroidManifest.xml"
          "$apksigner" verify --verbose "$apk"
          python3 scripts/ci/verify-product-artifact.py apk \
            --lock gradle/product-bootstrap.properties \
            --bootstrap "$RUNNER_TEMP/bootstrap-aarch64.zip" \
            --apk "$apk" \
            --manifest-xml "$RUNNER_TEMP/AndroidManifest.xml" \
            | tee product-apk-verification.json
          cp "$RUNNER_TEMP/bootstrap-verification.json" product-bootstrap-verification.json

      # Do not distribute the ephemeral-debug-signed APK while the product APT
      # key and signed repository are intentionally absent. Upload proof only.
      - name: Upload POC verification reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: prodysor-terminal-poc-verification-${{ github.sha }}
          path: |
            product-apk-verification.json
            product-bootstrap-verification.json
          if-no-files-found: error
          retention-days: 7
